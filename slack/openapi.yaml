        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    BotToken:
      type: http
      scheme: bearer
      description: Bot token (xoxb-...) from an installed app. Scopes are listed per operation.
    UserToken:
      type: http
      scheme: bearer
      description: User token (xoxp-...) from OAuth. Scopes are listed per operation.
    OrgToken:
      type: http
      scheme: bearer
      description: Org-level admin token (xoxe.xoxp-...)
    AppToken:
      type: http
      scheme: bearer
      description: App-level token (xapp-...)
    ConfigToken:
      type: http
      scheme: bearer
      description: App configuration access token
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Pass `response_metadata.next_cursor` from the previous response. Omit for the first page.
      schema:
        type: string
    Limit100:
      name: limit
      in: query
      required: false
      description: Maximum items to return. Recommended no more than 200 per page; under 1000.
      schema:
        type: integer
        default: 100
  responses:
    Error:
      description: Error. Check `error` for the code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OkResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          const: true
        warning:
          type: string
        response_metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    ErrorResponse:
      type: object
      required:
      - ok
      - error
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          description: Machine-readable error code.
        needed:
          type: string
          description: Scope needed, when error is `missing_scope`.
        provided:
          type: string
          description: Scopes the token has, when error is `missing_scope`.
        response_metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    ResponseMetadata:
      type: object
      properties:
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Empty when there are no more pages.
        warnings:
          type: array
          items:
            type: string
        messages:
          type: array
          items:
            type: string
    Message:
      type: object
      description: 'Message object (subset). Full schema: docs.slack.dev/reference/events/message'
      required:
      - type
      - ts
      properties:
        type:
          type: string
        subtype:
          type: string
        ts:
          type: string
        thread_ts:
          type: string
        user:
          type: string
        bot_id:
          type: string
        text:
          type: string
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
    Conversation:
      type: object
      description: 'Conversation object (subset). Full schema: docs.slack.dev/reference/objects/conversation-object'
      required:
      - id
      properties:
        id:
          type: string
          examples:
          - C012AB3CD
        name:
          type: string
        name_normalized:
          type: string
        is_channel:
          type: boolean
        is_group:
          type: boolean
        is_im:
          type: boolean
        is_mpim:
          type: boolean
        is_private:
          type: boolean
        is_archived:
          type: boolean
        is_general:
          type: boolean
        is_member:
          type: boolean
        is_shared:
          type: boolean
        is_org_shared:
          type: boolean
        created:
          type: integer
          description: Unix timestamp.
        creator:
          type: string
        topic:
          type: object
          properties:
            value:
              type: string
            creator:
              type: string
            last_set:
              type: integer
        purpose:
          type: object
          properties:
            value:
              type: string
            creator:
              type: string
            last_set:
              type: integer
        num_members:
          type: integer
        previous_names:
          type: array
          items:
            type: string
        warning:
          type: string
    User:
      type: object
      description: 'User object (subset). Full schema: docs.slack.dev/reference/objects/user-object'
      required:
      - id
      properties:
        id:
          type: string
          examples:
          - W012A3CDE
        team_id:
          type: string
        name:
          type: string
        real_name:
          type: string
        deleted:
          type: boolean
        is_bot:
          type: boolean
        is_admin:
          type: boolean
        is_owner:
          type: boolean
        is_primary_owner:
          type: boolean
        is_restricted:
          type: boolean
        is_ultra_restricted:
          type: boolean
        is_app_user:
          type: boolean
        is_stranger:
          type: boolean
          description: True for a user from a foreign workspace in a shared channel.
        tz:
          type: string
        tz_label:
          type: string
        tz_offset:
          type: integer
        updated:
          type: integer
        locale:
          type: string
        profile:
          type: object
          description: Profile fields. Only image_* fields are guaranteed. email needs users:read.email.
          properties:
            email:
              type: string
              format: email
            real_name:
              type: string
            display_name:
              type: string
            title:
              type: string
            image_512:
              type: string
              format: uri
    Team:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        email_domain:
          type: string
        enterprise_id:
          type: string
        enterprise_name:
          type: string
        icon:
          type: object
          properties:
            image_default:
              type: boolean
          additionalProperties: true
    OkBase:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
    AuthTestResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          url:
            type: string
            format: uri
          team:
            type: string
          user:
            type: string
          team_id:
            type: string
          user_id:
            type: string
          bot_id:
            type: string
            description: Present with bot tokens.
          enterprise_id:
            type: string
            description: Present when the team belongs to an Enterprise organization.
    ChatPostMessageRequest:
      type: object
      required:
      - channel
      properties:
        channel:
          type: string
          description: Conversation ID (C..., G..., D...), or a user ID (U...) to open a DM with the app.
        text:
          type: string
          description: Message text. When `blocks` is set, this is the notification fallback. Keep under 4,000 characters.
        markdown_text:
          type: string
          maxLength: 12000
          description: Markdown-formatted text. Do not combine with `text` or `blocks`.
        blocks:
          type: array
          description: Block Kit blocks. See docs.slack.dev/reference/block-kit/blocks
          items:
            type: object
            additionalProperties: true
        attachments:
          type: array
          description: Legacy attachments. Prefer `blocks`. Max 100.
          items:
            type: object
            additionalProperties: true
        thread_ts:
          type: string
          description: Timestamp of the parent message to reply in a thread. Use the parent, not a reply.
        reply_broadcast:
          type: boolean
          default: false
          description: Also show a thread reply in the channel. Use sparingly.
        metadata:
          type: object
          description: Message metadata with event_type and event_payload.
          properties:
            event_type:
              type: string
            event_payload:
              type: object
              additionalProperties: true
        username:
          type: string
          description: Requires chat:write.customize.
        icon_emoji:
          type: string
          description: Requires chat:write.customize. Overrides icon_url.
        icon_url:
          type: string
          format: uri
          description: Requires chat:write.customize.
        link_names:
          type: boolean
          description: Link user groups. Individual user linking is no longer supported; use the mention syntax instead.
        mrkdwn:
          type: boolean
          default: true
        parse:
          type: string
          description: Controls how text is parsed. `none` removes URL hyperlinks; `full` disables mrkdwn.
        unfurl_links:
          type: boolean
        unfurl_media:
          type: boolean
        unfurl_app_links:
          type: boolean
          description: When omitted, follows unfurl_links.
        current_draft_last_updated_ts:
          type: string
          description: Timestamp of the draft's last update, for draft sync.
        as_user:
          type: boolean
          deprecated: true
          description: Legacy. Classic apps only.
    ChatPostMessageResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          channel:
            type: string
          ts:
            type: string
          message:
            $ref: '#/components/schemas/Message'
    ChatUpdateRequest:
      type: object
      required:
      - channel
      - ts
      properties:
        channel:
          type: string
          description: Conversation ID. For a DM, use the DM ID (starts with D), not a user ID.
        ts:
          type: string
          description: Timestamp of the message to update.
        text:
          type: string
        markdown_text:
          type: string
          maxLength: 12000
        blocks:
          type: array
          description: New blocks. Send [] to remove existing blocks.
          items:
            type: object
            additionalProperties: true
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
        file_ids:
          type: array
          items:
            type: string
          description: New file IDs to attach to the message.
        metadata:
          type: object
          description: Send {} to remove existing metadata. Omit to keep it.
          additionalProperties: true
        link_names:
          type: boolean
        parse:
          type: string
          enum:
          - client
          - none
          - full
          default: client
        reply_broadcast:
          type: boolean
        as_user:
          type: boolean
          deprecated: true
    ChatUpdateResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          channel:
            type: string
          ts:
            type: string
          text:
            type: string
          message:
            $ref: '#/components/schemas/Message'
    ChatDeleteRequest:
      type: object
      required:
      - channel
      - ts
      properties:
        channel:
          type: string
        ts:
          type: string
        as_user:
          type: boolean
          deprecated: true
    ChatDeleteResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          channel:
            type: string
          ts:
            type: string
    ConversationIdRequest:
      type: object
      required:
      - channel
      properties:
        channel:
          type: string
    ConversationsCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9_-]+$
          description: Lowercase letters, numbers, hyphens, underscores.
        is_private:
          type: boolean
          default: false
        team_id:
          type: string
          description: Required with an org-wide token.
    ConversationResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          channel:
            $ref: '#/components/schemas/Conversation'
    ConversationsListResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          channels:
            type: array
            items:
              $ref: '#/components/schemas/Conversation'
          response_metadata:
            $ref: '#/components/schemas/ResponseMetadata'
    ConversationsInfoResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          channel:
            $ref: '#/components/schemas/Conversation'
    ConversationsHistoryResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          messages:
            type: array
            items:
              $ref: '#/components/schemas/Message'
          has_more:
            type: boolean
          pin_count:
            type: integer
          latest:
            type: string
            description: Present when `latest` is passed with inclusive=true, limit=1 lookups.
          response_metadata:
            $ref: '#/components/schemas/ResponseMetadata'
    ConversationsMembersResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          members:
            type: array
            items:
              type: string
              description: User IDs.
          response_metadata:
            $ref: '#/components/schemas/ResponseMetadata'
    UsersListResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          members:
            type: array
            items:
              $ref: '#/components/schemas/User'
          cache_ts:
            type: integer
          response_metadata:
            $ref: '#/components/schemas/ResponseMetadata'
    UsersInfoResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          user:
            $ref: '#/components/schemas/User'
    ReactionsAddRequest:
      type: object
      required:
      - channel
      - timestamp
      - name
      properties:
        channel:
          type: string
          description: Channel containing the message.
        timestamp:
          type: string
          description: Timestamp of the message.
        name:
          type: string
          description: Emoji name without colons, for example thumbsup.
    TeamInfoResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          team:
            $ref: '#/components/schemas/Team'
    AdminAnalyticsGetFileResponse:
