          type: array
          maxItems: 10
          description: Full set of commands for the calling agent, replacing the previous set. Empty array clears them. Item
            fields name, description and argument_hint appear in an example only
          items:
            type: object
            description: type not stated on docs page for item fields
    AgentsConversationsSetPropertiesRequest:
      type: object
      required:
      - token
      - channel_id
      description: At least one property field must be provided
      properties:
        token:
          type: string
          description: Granular bot token with code_channels:manage scope
        channel_id:
          type: string
          description: ID of the code channel to update
        title:
          type: string
          description: New display title for the agent session. Being deprecated
        status:
          type: string
          enum:
          - active
          - processing
          - suspended
          - closed
          description: New status for the agent session. Being deprecated
        code_channel:
          type: object
          description: Code channel properties. Only provided fields are updated. context_bar_items replaces the full set,
            max 5
          properties:
            context_bar_items:
              type: array
              maxItems: 5
              description: Replaces the entire current set. Each item has url or item_type action, not both. Item fields key,
                label, icon and url appear in an example only
              items:
                type: object
                description: type not stated on docs page for item fields
        agent_resource:
          type: object
          description: Agent resource properties. Only provided fields are updated
    AgentsConversationsSetViewRequest:
      type: object
      required:
      - token
      - channel_id
      properties:
        token:
          type: string
          description: Granular bot token with code_channels:manage scope
        channel_id:
          type: string
          description: ID of the code channel to render the view in
        type:
          description: type not stated on docs page. Defaults to html
          enum:
          - html
          - diff
          - block_kit
          - canvas
          - pull_request
        view_key:
          type: string
          description: Agent-assigned stable ID used as the upsert key. Required for html, block_kit and canvas
        content:
          type: string
          maxLength: 1000000
          description: HTML document for html views, or unified diff text for diff views. Capped at 1,000,000 bytes
        blocks:
          description: type not stated on docs page. Block Kit blocks. Required for block_kit
        canvas_id:
          description: type not stated on docs page. Encoded canvas ID. Required for canvas
        access_level:
          type: string
          enum:
          - read
          - write
          - comment
          default: write
          description: Access level granted to the channel for canvas views
        agent_content_hash:
          type: string
          description: Hash of the agent last-written markdown, used to detect human edits
        pr_url:
          type: string
          description: Pull request URL. Required for pull_request views
        base_branch:
          type: string
          description: Base branch name for display in diff views
        head_branch:
          type: string
          description: Head branch name for display in diff views
        name:
          type: string
          description: Display label for the view tab. Takes precedence over label
        label:
          type: string
          description: Deprecated alias for name
        csp:
          type: object
          description: Content-Security-Policy domain declarations. Only resource_domains is honored at render time
    AgentsSessionsRenameRequest:
      type: object
      required:
      - token
      - channel_id
      - title
      properties:
        token:
          type: string
          description: Granular bot token with chat:write scope
        channel_id:
          type: string
          description: ID of the channel containing the agent session
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: New session title, 1 to 200 characters. For a session channel this also renames the channel
        thread_ts:
          type: string
          description: Thread root message timestamp. Required for thread-based sessions in regular channels and DMs. Must
            be omitted for session channels
    AgentsSessionsSetStatusRequest:
      type: object
      required:
      - token
      - status
      properties:
        token:
          type: string
          description: Granular bot token with chat:write scope
        status:
          type: string
          enum:
          - active
          - processing
          - suspended
          - closed
          description: Lifecycle status to set
        channel_id:
          type: string
          description: ID of the channel containing the agent session. Required for public channels
        thread_ts:
          type: string
          description: Thread root message timestamp. Required for thread-based sessions. Must be omitted for session channels
        title:
          type: string
          maxLength: 200
          description: Session title. Applied only on creation and ignored if the session exists
        initiator_user_id:
          type: string
          description: User who initiated the session. Applied only on creation. Must be a channel member
        icon_emoji:
          type: string
          description: Emoji used as the agent icon. Takes priority over icon_url. Requires chat:write.customize
        icon_url:
          type: string
          description: Image URL for the agent icon. Requires chat:write.customize
        username:
          type: string
          maxLength: 200
          description: Display name override for the agent. Requires chat:write.customize
    AssistantSearchContextRequest:
      type: object
      required:
      - token
      - query
      properties:
        token:
          type: string
          description: Auth token with required scopes
        query:
          type: string
          description: User prompt or search query
        action_token:
          type: string
          description: Action token received in a message event
        channel_types:
          type: array
          description: Channel types to search. Default public_channel
          items:
            type: string
            enum:
            - public_channel
            - private_channel
            - mpim
            - im
        content_types:
          type: array
          description: Content types to include. Default messages
          items:
            type: string
            enum:
            - messages
            - files
            - channels
            - users
        include_bots:
          type: boolean
          description: Whether results include bots
        include_deleted_users:
          type: boolean
          default: false
          description: Whether user results include deleted users
        before:
          type: integer
          description: UNIX timestamp. Returns results before this date
        after:
          type: integer
          description: UNIX timestamp. Returns results after this date
        include_context_messages:
          type: boolean
          default: false
          description: Whether to include messages surrounding each main result
        context_channel_id:
          description: type not stated on docs page. Context channel ID for scoping the search
        cursor:
          type: string
          description: Cursor from a previous response. Blank for the first request
        limit:
          type: integer
          maximum: 20
          default: 20
          description: Number of results, max 20
        sort:
          type: string
          enum:
          - score
          - timestamp
          default: score
          description: Field to sort by
        sort_dir:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Sort direction
        include_message_blocks:
          type: boolean
          description: Whether to return message blocks
        highlight:
          type: boolean
          default: false
          description: Whether to highlight the query in results
        term_clauses:
          type: array
          minItems: 1
          maxItems: 5
          description: Results must match every clause. Min 1, max 5. Item type not stated on docs page
          items:
            description: type not stated on docs page
        modifiers:
          type: string
          description: Modifiers in modifier:value format. Affects term clauses only
        include_archived_channels:
          type: boolean
          description: Whether to include archived channels
        disable_semantic_search:
          type: boolean
          default: false
          description: When true, uses keyword-only search
