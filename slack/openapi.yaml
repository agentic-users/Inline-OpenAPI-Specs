      security: *id004
      parameters:
      - name: channel
        in: query
        required: false
        description: Filter files by channel ID.
        schema:
          type: string
      - name: count
        in: query
        required: false
        description: Not described on docs page. Default 100.
        schema:
          description: type not stated on docs page.
      - name: page
        in: query
        required: false
        description: Not described on docs page. Default 1.
        schema:
          description: type not stated on docs page.
      - name: show_files_hidden_by_limit
        in: query
        required: false
        description: Show truncated info for files hidden because they are too old or the team is over the file limit.
        schema:
          type: boolean
      - name: team_id
        in: query
        required: false
        description: Encoded team ID. Required with an org token; ignored with a workspace token.
        schema:
          type: string
      - name: ts_from
        in: query
        required: false
        description: Files created after this timestamp (inclusive).
        schema:
          type: string
      - name: ts_to
        in: query
        required: false
        description: Files created before this timestamp (inclusive).
        schema:
          type: string
      - name: types
        in: query
        required: false
        description: 'Comma-separated file types. Listed: all, spaces, snippets, images, gdocs, zips, pdfs. List is not exhaustive.'
