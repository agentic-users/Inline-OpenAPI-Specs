      properties:
        token:
          type: string
          description: Auth token with required scopes
        canvas_id:
          description: type not stated on docs page. Encoded ID of the canvas
        channel_ids:
          type: array
          minItems: 1
          maxItems: 1
          description: Channels to update access for. Min 1, max 1. Item type not stated
        user_ids:
          type: array
          minItems: 1
          maxItems: 1
          description: Users to update access for. Min 1, max 1. Item type not stated
    CanvasesAccessSetRequest:
      type: object
      required:
      - token
      - canvas_id
      - access_level
      description: channel_ids and user_ids cannot be used together
      properties:
        token:
          type: string
          description: Auth token with required scopes
        canvas_id:
          description: type not stated on docs page. Encoded ID of the canvas
        access_level:
          type: string
          enum:
          - read
          - write
          - owner
          description: Desired access level
        channel_ids:
          type: array
          description: Channels to update access for. Cannot be used with user_ids. Item type not stated
        user_ids:
          type: array
          description: Users to update access for. Cannot be used with channel_ids. Item type not stated
    CanvasesCreateRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: Auth token used to authenticate the session
        title:
          type: string
          description: Title of the newly created canvas
        document_content:
          description: type not stated on docs page. Describes the type and value of the content. Markdown limited to 1 MiB
            (1,048,576 characters)
        channel_id:
          type: string
          description: Channel ID the canvas will be tabbed in. Required for free teams
    CanvasesDeleteRequest:
      type: object
      required:
      - token
      - canvas_id
      properties:
        token:
          type: string
          description: Auth token with required scopes
        canvas_id:
          description: type not stated on docs page. Encoded ID of the canvas
    CanvasesEditRequest:
      type: object
      required:
      - token
      - canvas_id
      - changes
      properties:
        token:
          type: string
          description: Auth token used to authenticate the session
        canvas_id:
          description: type not stated on docs page. Encoded ID of the canvas
        changes:
          type: array
          description: List of changes. Only one operation per call is currently supported. Each change has operation and
            document_content or title_content. Markdown per change limited to 1 MiB
          items:
            required:
            - operation
            properties:
              operation:
                type: string
                enum:
                - insert_after
                - insert_before
                - insert_at_start
                - insert_at_end
                - replace
                - delete
                - rename
                description: insert_after and insert_before need section_id. delete needs section_id. rename needs title_content
              section_id:
                description: type not stated on docs page
              document_content:
                description: type not stated on docs page. Example has type markdown and markdown keys
              title_content:
                description: type not stated on docs page. Example has type markdown and markdown keys
    CanvasesGetContentRequest:
      type: object
      required:
      - token
      - canvas_id
      properties:
        token:
          type: string
          description: Authentication token with required scopes
        canvas_id:
          description: type not stated on docs page. Encoded ID of the canvas
        content_type:
          type: string
          enum:
          - html
          - markdown
          default: markdown
          description: Format for the returned content
    CanvasesSectionsLookupRequest:
      type: object
      required:
      - token
      - canvas_id
      - criteria
      properties:
        token:
          type: string
          description: Auth token used to authenticate the session
        canvas_id:
          description: type not stated on docs page. Encoded ID of the canvas
        criteria:
          description: type not stated on docs page. Filtering criteria. section_types and contains_text may be combined.
            Some section types cannot be used as filters
          properties:
            section_types:
              description: type not stated on docs page. Accepted values any_header, blockquote, callout, canvas_unfurl, chart,
                citation, file_unfurl, flexbox, h1, h2, h3, horizontal_line, list, message_unfurl, sfdc_record_mention, sfdc_record_unfurl,
                table, user_mention, user_unfurl
            contains_text:
              description: type not stated on docs page. Text to match within a section
    ChatAppendStreamRequest:
      type: object
      required:
      - token
      - channel
      - ts
      - markdown_text
      properties:
        token:
          type: string
          description: Auth token
        channel:
          type: string
          description: Encoded ID that represents a channel, private group or DM
        ts:
          description: type not stated on docs page. Timestamp of the streaming message
        markdown_text:
          type: string
          maxLength: 12000
          description: Message text in markdown, appended to the message received so far
        chunks:
          type: array
          description: Streaming chunks. Supported types markdown_text, task_update, plan_update, blocks. Item type not stated
    ChatStartStreamRequest:
      type: object
      required:
      - token
      - channel
      properties:
        token:
          type: string
          description: Auth token
        channel:
          type: string
          description: Encoded ID for a channel, thread or DM
        chunks:
          type: array
          description: 'Streaming chunks: markdown text, task update, plan update or blocks. Item type not stated'
        markdown_text:
          type: string
          maxLength: 12000
          description: Message text in markdown
        thread_ts:
          type: string
          description: ts of a message to reply to. Omit to stream a top-level message, supported only in channels such as
            Slack Code. 0 is equivalent to omitting it
        recipient_user_id:
          description: type not stated on docs page. Encoded ID of the user who receives the streaming text. Required when
            streaming to channels
        recipient_team_id:
          type: string
          description: Encoded ID of the user team. Required when streaming to channels
        task_display_mode:
          type: string
          enum:
          - timeline
          - plan
          default: timeline
          description: timeline shows task cards with text. plan groups task updates in a plan block
        icon_emoji:
          type: string
          description: Emoji used as the message icon. Overrides icon_url
        icon_url:
          type: string
          description: Image URL used as the message icon
        username:
          type: string
          description: Bot username to display
    ChatStopStreamRequest:
      type: object
      required:
      - token
      - channel
      - ts
      properties:
        token:
          type: string
          description: Auth token
        channel:
          type: string
          description: Encoded ID for a channel, private group or DM
        ts:
          description: type not stated on docs page. Timestamp of the streaming message
        chunks:
          type: array
          description: Streaming chunks. Supported types markdown_text, task_update, plan_update, blocks. Item type not stated
        markdown_text:
          type: string
          maxLength: 12000
          description: Message text in markdown
        blocks:
          description: type not stated on docs page. Blocks rendered at the bottom of the finalized message. Limited to 50
        metadata:
          description: type not stated on docs page. URL-encoded JSON object with event_type and event_payload fields
    ChatUnfurlRequest:
      type: object
      required:
      - token
      description: Either unfurls or metadata must be provided. Channel and ts or unfurl_id and source must be provided
      properties:
        token:
          type: string
          description: Auth token with required scopes
        channel:
          type: string
          description: Channel ID of the message. Required for public channels
        ts:
          type: string
          description: Timestamp of the message. Required for public channels
        unfurls:
          type: string
          description: URL-encoded JSON map keyed by URLs in the message, pointing to unfurl blocks or attachments
        metadata:
          description: type not stated on docs page. URL-encoded JSON object with entity_type and entity_payload used to generate
            a Work Object
        user_auth_message:
          description: type not stated on docs page. Formatted string sent as an ephemeral authentication message
        user_auth_required:
          type: boolean
          default: false
          description: Requires the user to install the app before unfurls trigger for this domain
        user_auth_url:
          description: type not stated on docs page. Custom URL where users complete authentication. URL-encoded
        user_auth_blocks:
          description: type not stated on docs page. JSON array of blocks, URL-encoded, sent as an ephemeral message
        unfurl_id:
          type: string
          description: ID of the link to unfurl. Send with source
        source:
          type: string
          enum:
          - composer
          - conversations_history
          description: Where the link is located
    ChatMeMessageRequest:
