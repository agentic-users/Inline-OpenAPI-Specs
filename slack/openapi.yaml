# Slack Web API OpenAPI spec (compiled 2026-10-12 from docs.slack.dev method pages)
openapi: 3.1.0
info:
  title: Slack Web API (core methods)
  version: '2026-10-12'
  summary: Core Slack Web API methods, built from the live Slack docs at docs.slack.dev.
  description: 'Built from the markdown source of each method page on docs.slack.dev

    (retrieved 2026-10-12). Only the 15 methods below are covered.


    Auth: send the token in the `Authorization: Bearer <token>` header. Slack also accepts a `token`

    form field; this spec uses the header only.


    Responses: every response has an `ok` boolean. When `ok` is false, `error` holds the code.

    Some successful responses also include `warning` or `response_metadata.warnings`.


    Rate limits are documented per method (tier 2 = 20+/min, tier 3 = 50+/min, tier 4 = 100+/min,

    special = see docs). See the `x-slack-rate-limit-tier` extension on each operation.


    Scopes are the ones listed on each method page. Where a page lists several bot scopes

    without saying whether any or all are required, this spec lists them as alternatives.

    Verify before relying on a specific scope combination.

    '
externalDocs:
  description: Slack Web API method reference
  url: https://docs.slack.dev/reference/methods
servers:
- url: https://slack.com/api
  description: Slack production
tags:
- name: Auth
- name: Chat
- name: Conversations
- name: Users
- name: Reactions
- name: Team
paths:
  /auth.test:
    post:
      tags:
      - Auth
      operationId: authTest
      summary: Check authentication and identity
      description: Works with any token type. No scopes required.
      x-slack-rate-limit-tier: special
      security:
      - BotToken: []
      - UserToken: []
      responses:
        '200':
          description: Identity of the calling token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTestResponse'
        default:
          $ref: '#/components/responses/Error'
  /chat.postMessage:
    post:
      tags:
      - Chat
      operationId: chatPostMessage
      summary: Send a message to a channel, private channel, group DM, or DM
      x-slack-rate-limit-tier: special
      description: 'Requires `chat:write`. Bots can post to public channels only after the app is a member,

        unless `chat:write.public` is granted. Use `text`, `blocks`, `markdown_text`, or `attachments`.

        `chat:write.customize` is required to set `username`, `icon_url`, or `icon_emoji`.

        '
      security:
      - BotToken:
        - chat:write
      - UserToken:
        - chat:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPostMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatPostMessageRequest'
      responses:
        '200':
          description: Message posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPostMessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /chat.update:
    post:
      tags:
      - Chat
      operationId: chatUpdate
      summary: Update a message
      description: 'Only messages posted by the authenticated user (or bot) can be updated, plus `me_message`.

        Ephemeral messages cannot be updated. Omit `blocks` to keep existing blocks; send `[]` to remove them.

        '
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - chat:write
      - UserToken:
        - chat:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatUpdateRequest'
      responses:
        '200':
          description: Message updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatUpdateResponse'
        default:
          $ref: '#/components/responses/Error'
  /chat.delete:
    post:
      tags:
      - Chat
      operationId: chatDelete
      summary: Delete a message
      description: 'With a user token, only messages the user could delete in the Slack UI.

        With a bot token, only messages posted by that bot.

        '
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - chat:write
      - UserToken:
        - chat:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatDeleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatDeleteRequest'
      responses:
        '200':
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDeleteResponse'
        default:
          $ref: '#/components/responses/Error'
  /conversations.list:
    get:
      tags:
      - Conversations
      operationId: conversationsList
      summary: List channels and other conversations
      description: 'Returns channel-like conversations the token can see, filtered by `types`.

        Use `response_metadata.next_cursor` to page. Filters apply after each virtual page is built.

        Scopes shown per token type on the docs page: channels:read, groups:read, im:read, mpim:read.

        '
      x-slack-rate-limit-tier: '2'
      security:
      - BotToken:
        - channels:read
      - BotToken:
        - groups:read
      - BotToken:
        - im:read
      - BotToken:
        - mpim:read
      - UserToken:
        - channels:read
      - UserToken:
        - groups:read
      - UserToken:
        - im:read
      - UserToken:
        - mpim:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit100'
      - name: exclude_archived
        in: query
        required: false
        description: Set to true to exclude archived channels.
        schema:
          type: boolean
          default: false
      - name: types
        in: query
        required: false
        description: Comma-separated list from public_channel, private_channel, mpim, im.
        schema:
          type: string
          default: public_channel
          examples:
          - public_channel,private_channel
      - name: team_id
        in: query
        required: false
        description: Required when using an org-wide token. Ignored with a workspace token.
        schema:
          type: string
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsListResponse'
        default:
          $ref: '#/components/responses/Error'
  /conversations.info:
    get:
      tags:
      - Conversations
      operationId: conversationsInfo
      summary: Get information about a conversation
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - channels:read
      - BotToken:
        - groups:read
      - BotToken:
        - im:read
      - BotToken:
        - mpim:read
      - UserToken:
        - channels:read
      - UserToken:
        - groups:read
      - UserToken:
        - im:read
      - UserToken:
        - mpim:read
      parameters:
      - name: channel
        in: query
        required: true
        description: Conversation ID.
        schema:
          type: string
      - name: include_locale
        in: query
        required: false
        description: Include the conversation locale.
        schema:
          type: boolean
          default: false
      - name: include_num_members
        in: query
        required: false
        description: Include the member count.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsInfoResponse'
        default:
          $ref: '#/components/responses/Error'
  /conversations.history:
    get:
      tags:
      - Conversations
      operationId: conversationsHistory
      summary: Fetch message history for a conversation
      description: 'Returns up to `limit` messages, newest first. Use `oldest`/`latest` (Unix timestamps) to bound the range

        and `has_more` plus `response_metadata.next_cursor` to page.


        RATE LIMIT WARNING: for new non-Marketplace, commercially distributed apps (since May 29, 2025),

        this method is limited to 1 request per minute and `limit` is capped at 15.

        Marketplace and internal customer-built apps use tier 3.

        '
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - channels:history
      - BotToken:
        - groups:history
      - BotToken:
        - im:history
      - BotToken:
        - mpim:history
      - UserToken:
        - channels:history
      - UserToken:
        - groups:history
      - UserToken:
        - im:history
      - UserToken:
        - mpim:history
      parameters:
      - name: channel
        in: query
        required: true
        description: Conversation ID.
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - name: include_all_metadata
        in: query
        required: false
        description: Return all metadata for each message.
        schema:
          type: boolean
      - name: inclusive
        in: query
        required: false
        description: Include messages exactly at `oldest` or `latest`. Ignored unless one of them is set.
        schema:
          type: boolean
      - name: latest
        in: query
        required: false
        description: Only messages before this timestamp. Defaults to now.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum items to return. Max 999. Max 15 for new non-Marketplace apps.
        schema:
          type: integer
          minimum: 1
          maximum: 999
          default: 100
      - name: oldest
        in: query
        required: false
        description: Only messages after this timestamp.
        schema:
          type: string
          default: '0'
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsHistoryResponse'
        default:
          $ref: '#/components/responses/Error'
  /conversations.create:
    post:
      tags:
      - Conversations
      operationId: conversationsCreate
      summary: Create a public or private channel
      description: 'Channel names: lowercase letters, numbers, hyphens, underscores; 80 characters or less.

        Use `conversations.open` to start a DM or group DM instead.

        `team_id` is required with an org-wide token and ignored with a workspace token.

        '
      x-slack-rate-limit-tier: '2'
      security:
      - BotToken:
        - channels:manage
      - BotToken:
        - channels:write
      - UserToken:
        - channels:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationsCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationsCreateRequest'
      responses:
        '200':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        default:
          $ref: '#/components/responses/Error'
  /conversations.join:
    post:
      tags:
      - Conversations
      operationId: conversationsJoin
      summary: Join a public channel
      description: Joins the calling token to an existing conversation. If already a member, the response includes a warning.
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - channels:join
      - UserToken:
        - channels:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationIdRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationIdRequest'
      responses:
        '200':
          description: Joined (or already a member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        default:
          $ref: '#/components/responses/Error'
  /conversations.members:
    get:
      tags:
      - Conversations
      operationId: conversationsMembers
      summary: List member IDs of a conversation
      x-slack-rate-limit-tier: '4'
      security:
      - BotToken:
        - channels:read
      - BotToken:
        - groups:read
      - BotToken:
        - im:read
      - BotToken:
        - mpim:read
      - UserToken:
        - channels:read
      - UserToken:
        - groups:read
      - UserToken:
        - im:read
      - UserToken:
        - mpim:read
      parameters:
      - name: channel
        in: query
        required: true
        description: Conversation ID.
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        required: false
        description: Maximum items to return. Recommended no more than 200 per page.
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Member IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsMembersResponse'
        default:
          $ref: '#/components/responses/Error'
  /users.list:
    get:
      tags:
      - Users
      operationId: usersList
      summary: List all users in the workspace
      description: 'Includes invited and deactivated users. For large teams, pass `limit`; omitting it can return

        `limit_required` or HTTP 500. The `email` field needs `users:read.email` in addition to `users:read`.

        Presence via this method is deprecated; use `users.getPresence` or presence subscriptions.

        '
      x-slack-rate-limit-tier: '2'
      security:
      - BotToken:
        - users:read
      - UserToken:
        - users:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - name: include_locale
        in: query
        required: false
        description: Include locale for each user.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        description: Maximum items to return. Recommended no more than 200 per page.
        schema:
          type: integer
          default: 0
      - name: team_id
        in: query
        required: false
        description: Required with an org-wide token. Ignored with a workspace token.
        schema:
          type: string
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        default:
          $ref: '#/components/responses/Error'
  /users.info:
    get:
      tags:
      - Users
      operationId: usersInfo
      summary: Get a user by ID
      description: Returns a user object. The `email` field needs `users:read.email`.
      x-slack-rate-limit-tier: '4'
      security:
      - BotToken:
        - users:read
      - UserToken:
        - users:read
      parameters:
      - name: user
        in: query
        required: false
        description: User ID to look up.
        schema:
          type: string
      - name: include_locale
        in: query
        required: false
        description: Include the user's locale.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersInfoResponse'
        default:
          $ref: '#/components/responses/Error'
  /users.lookupByEmail:
    get:
      tags:
      - Users
      operationId: usersLookupByEmail
      summary: Find a user by email address
      description: 'Requires `users:read.email`. Custom bot users cannot use this method.

        If the user is deactivated, returns `users_not_found`; use `users.list` and filter instead.

        '
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - users:read.email
      - UserToken:
        - users:read.email
      parameters:
      - name: email
        in: query
        required: true
        description: Email address of a user in the workspace.
        schema:
          type: string
          format: email
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersInfoResponse'
        default:
          $ref: '#/components/responses/Error'
  /reactions.add:
    post:
      tags:
      - Reactions
      operationId: reactionsAdd
      summary: Add an emoji reaction to a message
      description: 'Identify the message with `channel` and `timestamp`. For skin tones on Unicode emoji, append

        `::skin-tone-N` (N from 2 to 6), for example `thumbsup::skin-tone-6`.

        File and file_comment arguments are deprecated.

        '
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - reactions:write
      - UserToken:
        - reactions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionsAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReactionsAddRequest'
      responses:
        '200':
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        default:
          $ref: '#/components/responses/Error'
  /team.info:
    get:
      tags:
      - Team
      operationId: teamInfo
      summary: Get information about the current team (workspace)
      x-slack-rate-limit-tier: '3'
      security:
      - BotToken:
        - team:read
      - UserToken:
        - team:read
      parameters:
      - name: team
        in: query
        required: false
        description: Team ID. Omit to get the current team.
        schema:
          type: string
      - name: domain
        in: query
        required: false
        description: Look up by domain instead of team. Only works when `team` is unset and the domain belongs to a team in
          the same enterprise.
        schema:
          type: string
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInfoResponse'
        default:
          $ref: '#/components/responses/Error'
  /admin.analytics.getFile:
    get:
      operationId: admin.analytics.getFile
      description: Download analytics export as gzipped newline-delimited JSON (application/gzip), not a JSON body; the schema
        below lists row fields. Error responses are JSON.
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: Authentication token bearing required scopes. Also accepted as an Authorization header.
      - name: type
        in: query
        required: true
        schema:
          type: string
          description: Export type.
          enum:
          - member
          - public_channel
      - name: date
        in: query
        required: false
        schema:
          description: type not stated on docs page. Format YYYY-MM-DD in UTC. Required unless metadata_only is true.
      - name: metadata_only
        in: query
        required: false
        schema:
          type: boolean
          description: Usable only with type public_channel. Omit date when set.
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsGetFileResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - UserToken:
        - admin.analytics:read
      x-slack-rate-limit-tier: '2'
      x-slack-error-codes:
      - access_denied
      - accesslimited
      - account_inactive
      - data_not_available
      - deprecated_endpoint
      - ekm_access_denied
      - enterprise_is_restricted
      - fatal_error
      - feature_not_available
      - feature_not_enabled
      - file_not_found
      - file_not_yet_available
      - internal_error
      - invalid_arg_name
      - invalid_arguments
      - invalid_array_arg
      - invalid_auth
      - invalid_charset
      - invalid_date
      - invalid_form_data
      - invalid_post_type
      - invalid_type
      - member_analytics_disabled
      - metadata_not_available
      - metadata_only_does_not_support_date
      - method_deprecated
      - missing_post_type
      - missing_scope
      - no_permission
      - not_an_admin
      - not_allowed_token_type
      - not_authed
      - org_level_email_display_disabled
      - org_login_required
      - ratelimited
      - request_timeout
      - service_unavailable
      - team_access_not_granted
      - team_added_to_org
      - token_expired
      - token_revoked
      - two_factor_setup_required
      - user_cannot_manage_public_channels
  /admin.analytics.messages.activity:
    get:
      operationId: admin.analytics.messages.activity
      description: Message activity (views, reactions, shares, clicks) for a channel.
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: Authentication token bearing required scopes. Also accepted as an Authorization header.
      - name: channel
        in: query
        required: true
        schema:
          type: string
          description: Channel ID for channel of the message activity to query.
      - name: oldest_ts
        in: query
        required: false
        schema:
          type: string
          description: Oldest timestamp to include. Defaults to 7 days before now, or 7 days before latest_ts if only latest_ts
            is passed.
      - name: latest_ts
        in: query
        required: false
        schema:
          type: string
          description: Most recent timestamp to include. Defaults to now, or 7 days after oldest_ts if only oldest_ts is passed.
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: Maximum entries to return.
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsMessagesActivityResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - UserToken:
        - admin.analytics:read
      x-slack-rate-limit-tier: '2'
      x-slack-error-codes:
      - access_denied
      - accesslimited
      - account_inactive
      - channel_not_found
      - deprecated_endpoint
      - ekm_access_denied
      - enterprise_is_restricted
      - fatal_error
      - internal_error
      - invalid_arg_name
      - invalid_arguments
      - invalid_array_arg
      - invalid_auth
      - invalid_charset
      - invalid_form_data
      - invalid_post_type
      - method_deprecated
      - missing_post_type
      - missing_scope
      - no_permission
      - not_allowed_token_type
      - not_an_enterprise
      - not_authed
      - org_login_required
      - rate_limited
      - ratelimited
      - request_timeout
      - restricted_action
      - restricted_plan_level
      - service_unavailable
      - team_access_not_granted
      - team_added_to_org
      - token_expired
      - token_revoked
      - two_factor_setup_required
  /admin.analytics.messages.metadata:
    get:
      operationId: admin.analytics.messages.metadata
      description: 'Message metadata for messages in a channel. HTTP method not stated on docs page; GET used to match sibling
        analytics pages. Rate limit: 1200 requests per minute, burst 2000 (no tier label on page, so tier set to special).
        The pagination example passes limit, which the argument list omits.'
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: Authentication token bearing required scopes. Also accepted as an Authorization header.
      - name: channel
        in: query
        required: true
        schema:
          type: string
          description: Channel ID for the channel containing the messages to query.
      - name: oldest_ts
        in: query
        required: false
        schema:
          type: string
          description: Oldest timestamp to include in the results.
      - name: latest_ts
        in: query
        required: false
        schema:
          type: string
          description: Most recent timestamp to include. Defaults to current time.
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsMessagesMetadataResponse'
        default:
          $ref: '#/components/responses/Error'
      security:
      - UserToken:
        - admin.analytics:read
      x-slack-rate-limit-tier: special
      x-slack-error-codes:
      - access_denied
      - accesslimited
      - account_inactive
      - admin_analytics_disabled
      - analytics_unavailable
      - channel_not_found
      - deprecated_endpoint
      - different_team_owns_message_metadata_for_channel
      - ekm_access_denied
      - enterprise_is_restricted
      - fatal_error
      - internal_error
      - invalid_arg_name
      - invalid_arguments
      - invalid_array_arg
      - invalid_auth
      - invalid_charset
      - invalid_form_data
      - invalid_post_type
      - method_deprecated
      - missing_post_type
      - missing_scope
      - no_permission
      - not_allowed_token_type
      - not_an_enterprise
      - not_authed
      - org_login_required
      - rate_limited
      - ratelimited
      - request_timeout
      - restricted_plan_level
      - service_unavailable
      - team_access_not_granted
      - team_added_to_org
      - token_expired
      - token_revoked
      - two_factor_setup_required
