              packageId:
                type: string
              packageReleaseId:
                type: [string, 'null']
        sensitivityLabel:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
        inviteLinks:
          type: object
          additionalProperties: true
    CreateBaseFromPackageRequest:
