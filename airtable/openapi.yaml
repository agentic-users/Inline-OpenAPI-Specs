        name:
          type: string
        permissionLevel:
          type: string
          enum: [none, read, comment, edit, create, owner]
        workspaceId:
          type: string
        interfaces:
          type: object
          description: Keyed by interface ID.
          additionalProperties:
            type: object
        collaborators:
          type: object
          description: Deprecated; use individualCollaborators and groupCollaborators.
