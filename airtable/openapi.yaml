    FieldType:
      type: string
      enum: [autoNumber, barcode, button, checkbox, createdBy, createdTime, count, formula, lastModifiedTime, lastModifiedBy, lookup, number, percent, currency, duration, multilineText, phoneNumber, rating, richText, rollup, singleLineText, email, url, externalSyncSource, aiText, multipleRecordLinks, singleSelect, multipleSelects, singleCollaborator, multipleCollaborators, date, dateTime, multipleAttachments, multipleLookupValues]
    BaseDetails:
      type: object
      required: [id, createdTime, name, permissionLevel, workspaceId]
