# Sources: https://airtable.com/developers/web/api/introduction ; endpoint pages under https://airtable.com/developers/web/api/ (list-records, get-record, create-records, update-multiple-records, delete-multiple-records, update-record, get-base-schema, list-bases, get-base-collaborators, create-base, create-table, update-table, create-field, update-field, list-views, get-view-metadata, delete-base, create-workspace, delete-workspace, update-workspace-ai-allowlist, get-user-id-scopes, upload-attachment, post-sync-api-endpoint, list-comments, create-comment, update-comment, delete-comment, list-webhooks, create-a-webhook, delete-a-webhook, enable-disable-webhook-notifications, refresh-a-webhook, list-webhook-payloads, get-enterprise, get-users-by-id-or-email, get-user-by-id, manage-user-membership, create-descendant-enterprise, remove-user-from-enterprise, move-workspaces, move-user-groups, grant-admin-access, revoke-admin-access, list-enterprise-packages, create-base-from-package-enterprise, create-scim-user, put-scim-user, patch-scim-user); changelog https://airtable.com/developers/web/api/changelog ; built 2026-10-12
openapi: 3.1.0
info:
  title: Airtable Web API
  version: "2026-10-12"
  description: >-
    OpenAPI description built from the Airtable Web API reference pages (not an official Airtable file).
    Two endpoints (list personal access tokens and revoke enterprise personal access tokens) could not be fetched and are omitted.
  x-source-urls:
    - https://airtable.com/developers/web/api/introduction
    - https://airtable.com/developers/web/api/changelog
    - https://airtable.com/developers/web
servers:
  - url: https://api.airtable.com
    description: Airtable API
security:
  - bearerAuth: []
tags:
  - name: Records
  - name: Attachments
  - name: Sync
  - name: Metadata
  - name: Comments
  - name: Webhooks
  - name: User
  - name: Enterprise
  - name: SCIM
paths:
  /v0/{baseId}/{tableIdOrName}:
    get:
      operationId: listRecords
      tags: [Records]
      summary: List records
      description: Lists records in a table. Pages of up to 100 records; use offset to fetch the next page. Requires a URL under 16,000 characters; use POST listRecords otherwise.
      x-required-scopes: [data.records:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - name: timeZone
          in: query
          required: false
          description: Time zone for formatting dates when cellFormat is string. Required in that case.
          schema:
            type: string
        - name: userLocale
          in: query
          required: false
          description: Locale for formatting dates when cellFormat is string. Required in that case.
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Records per request. Maximum 100, default 100.
          schema:
            type: number
        - name: maxRecords
          in: query
          required: false
          description: Maximum total records to return across pages.
          schema:
            type: number
        - name: offset
          in: query
          required: false
          description: Offset from the previous response, used to fetch the next page.
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: View name or ID.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort specifications (JSON-encoded array of objects with field and optional direction).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SortSpec'
        - name: filterByFormula
          in: query
          required: false
          description: Formula that filters records. Must be URL-encoded.
          schema:
            type: string
        - name: cellFormat
          in: query
          required: false
          description: Cell value format. Default json. The string format is not guaranteed to be stable.
          schema:
            type: string
            enum: [json, string]
        - name: fields
          in: query
          required: false
          description: Field names or IDs to include in the response.
          schema:
            type: array
            items:
              type: string
        - name: returnFieldsByFieldId
          in: query
          required: false
          description: Keys field objects by field ID instead of name. Default false.
          schema:
            type: boolean
        - name: includeDateDependencyMetadata
          in: query
          required: false
          description: Returns linked-record cells as objects with an id. Default false, which returns record ID strings.
          schema:
            type: boolean
        - name: recordMetadata
          in: query
          required: false
          description: Adds commentCount to each record when set to commentCount.
          schema:
            type: array
            items:
              type: string
              enum: [commentCount]
      responses:
        '200':
          description: Records returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecordsResponse'
    post:
      operationId: createRecords
      tags: [Records]
      summary: Create records
      description: Creates one record (fields) or multiple records (records array).
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordsRequest'
      responses:
        '200':
          description: Record(s) created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRecordsResponse'
    patch:
      operationId: updateMultipleRecords
      tags: [Records]
      summary: Update multiple records (PATCH, optional upsert)
      description: Updates only the fields sent. When performUpsert is set, records are matched on fieldsToMergeOn.
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMultipleRecordsRequest'
      responses:
        '200':
          description: Records updated or upserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMultipleRecordsResponse'
    put:
      operationId: replaceMultipleRecords
      tags: [Records]
      summary: Update multiple records (PUT, destructive)
      description: Destructive update; clears cell values not included in the request. Accepts the same body as PATCH.
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMultipleRecordsRequest'
      responses:
        '200':
          description: Records replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMultipleRecordsResponse'
    delete:
      operationId: deleteMultipleRecords
      tags: [Records]
      summary: Delete multiple records
      description: Deletes records given as repeated records[] query values.
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - name: records
          in: query
          required: false
          description: Record IDs to delete, sent as repeated records[] values (e.g. ?records[]=rec...&records[]=rec...).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Records deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMultipleRecordsResponse'
  /v0/{baseId}/{tableIdOrName}/{recordId}:
    get:
      operationId: getRecord
      tags: [Records]
      summary: Get record
      description: Returns one record. If the record is not in the given table, a base-wide search is performed.
      x-required-scopes: [data.records:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
        - name: cellFormat
          in: query
          required: false
          description: json returns type-dependent JSON; string returns user-facing strings and requires timeZone and userLocale. Default json.
          schema:
            type: string
            enum: [json, string]
        - name: returnFieldsByFieldId
          in: query
          required: false
          description: Keys fields by field ID instead of name. Default false.
          schema:
            type: boolean
        - name: includeDateDependencyMetadata
          in: query
          required: false
          description: When true, linked-record fields return objects with an id. Default false.
          schema:
            type: boolean
      responses:
        '200':
          description: Record returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordObject'
    patch:
      operationId: updateRecord
      tags: [Records]
      summary: Update record (PATCH)
      description: Updates only the specified fields of one record.
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordRequest'
      responses:
        '200':
          description: Record updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordObject'
    put:
      operationId: replaceRecord
      tags: [Records]
      summary: Update record (PUT, destructive)
      description: Destructive update; clears cell values not specified in the request.
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordRequest'
      responses:
        '200':
          description: Record replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordObject'
  /v0/{baseId}/{recordId}/{attachmentFieldIdOrName}/uploadAttachment:
    servers:
      - url: https://content.airtable.com
        description: Content host for attachment uploads (as documented)
    post:
      operationId: uploadAttachment
      tags: [Attachments]
      summary: Upload attachment
      description: Uploads a base64-encoded file (5 MB limit). For larger files use a public URL with the multipleAttachments field model.
      x-required-scopes: [data.records:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/AttachmentFieldIdOrName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAttachmentRequest'
      responses:
        '200':
          description: Record with attachment added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordObject'
  /v0/{baseId}/{tableIdOrName}/sync/{apiEndpointSyncId}:
    post:
      operationId: postSyncApiEndpoint
      tags: [Sync]
      summary: Sync CSV data
      description: Sends raw CSV text to a sync endpoint. Limits per the docs - up to 10k rows, 500 columns, 2 MB per request; rate limit 20 requests per 5 minutes per base. Response fields not specified on the docs page.
      x-required-scopes: [data.records:write, schema.bases:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - name: apiEndpointSyncId
          in: path
          required: true
          description: Sync endpoint ID from the Sync API table setup flow or the synced table's settings.
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: Raw CSV text.
      responses:
        '200':
          description: Sync request accepted. Response body not documented.
  /v0/{baseId}/{tableIdOrName}/{recordId}/comments:
    get:
      operationId: listComments
      tags: [Comments]
      summary: List comments
      description: Lists comments on a record, newest first.
      x-required-scopes: [data.recordComments:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
        - name: pageSize
          in: query
          required: false
          description: Comments to return. Default 100, maximum 100.
          schema:
            type: number
        - name: offset
          in: query
          required: false
          description: Pointer to where results begin.
          schema:
            type: string
      responses:
        '200':
          description: Comments returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCommentsResponse'
    post:
      operationId: createComment
      tags: [Comments]
      summary: Create comment
      description: Creates a comment on a record. Mentions are written inline in text as @[userId].
      x-required-scopes: [data.recordComments:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /v0/{baseId}/{tableIdOrName}/{recordId}/comments/{rowCommentId}:
    patch:
      operationId: updateComment
      tags: [Comments]
      summary: Update comment
      description: Updates a comment. Only comments created by the caller can be updated.
      x-required-scopes: [data.recordComments:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/RowCommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
    delete:
      operationId: deleteComment
      tags: [Comments]
      summary: Delete comment
      description: Non-admin API users can delete only their own comments. Enterprise admins can delete any comment on a record.
      x-required-scopes: [data.recordComments:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/RowCommentId'
      responses:
        '200':
          description: Comment deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
  /v0/meta/bases:
    get:
      operationId: listBases
      tags: [Metadata]
      summary: List bases
      description: Returns the bases the token can access, 1,000 at a time.
      x-required-scopes: [schema.bases:read]
      parameters:
        - name: offset
          in: query
          required: false
          description: Pagination cursor. Pass it to request the next page.
          schema:
            type: string
      responses:
        '200':
          description: Bases returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBasesResponse'
    post:
      operationId: createBase
      tags: [Metadata]
      summary: Create base
      description: Creates a base with at least one table. The first field of each table becomes its primary field.
      x-required-scopes: [schema.bases:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBaseRequest'
      responses:
        '200':
          description: Base created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBaseResponse'
  /v0/meta/bases/{baseId}:
    get:
      operationId: getBaseCollaborators
      tags: [Metadata]
      summary: Get base
      description: Returns base metadata, optionally including collaborators, invite links, interfaces and packages.
      x-required-scopes: [schema.bases:read, workspacesAndBases:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - name: include
          in: query
          required: false
          description: Sections to include. Omitted sections are left out of the response.
          schema:
            type: array
            items:
              type: string
              enum: [collaborators, inviteLinks, interfaces, packages]
      responses:
        '200':
          description: Base returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseDetails'
    delete:
      operationId: deleteBase
      tags: [Metadata]
      summary: Delete base
      description: Enterprise admins only. Owners can restore deleted bases from the Trash within the plan's retention period.
      x-required-scopes: [workspacesAndBases:manage]
      parameters:
        - $ref: '#/components/parameters/BaseId'
      responses:
        '200':
          description: Base deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
  /v0/meta/bases/{baseId}/tables:
    get:
      operationId: getBaseSchema
      tags: [Metadata]
      summary: Get base schema
      description: Returns the schema of the tables in the base.
      x-required-scopes: [schema.bases:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - name: include
          in: query
          required: false
          description: Adds extra fields to views. The only allowed value is visibleFieldIds, which applies to grid views only.
          schema:
            type: array
            items:
              type: string
              enum: [visibleFieldIds]
      responses:
        '200':
          description: Table schemas returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseSchemaResponse'
    post:
      operationId: createTable
      tags: [Metadata]
      summary: Create table
      description: Creates a table and returns its schema. A default grid view is created.
      x-required-scopes: [schema.bases:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '200':
          description: Table created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
  /v0/meta/bases/{baseId}/tables/{tableIdOrName}:
    patch:
      operationId: updateTable
      tags: [Metadata]
      summary: Update table
      description: Updates a table's name, description or date-dependency settings.
      x-required-scopes: [schema.bases:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableRequest'
      responses:
        '200':
          description: Table updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
  /v0/meta/bases/{baseId}/tables/{tableId}/fields:
    post:
      operationId: createField
      tags: [Metadata]
      summary: Create field
      description: Creates a field. The request body variant depends on type; the docs describe 41 variants with type-specific options.
      x-required-scopes: [schema.bases:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '200':
          description: Field created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldResponse'
  /v0/meta/bases/{baseId}/tables/{tableId}/fields/{columnId}:
    patch:
      operationId: updateField
      tags: [Metadata]
      summary: Update field
      description: Updates a field's name, description or options (formula fields only for formula). At least one property is required.
      x-required-scopes: [schema.bases:write]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableId'
        - $ref: '#/components/parameters/ColumnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldRequest'
      responses:
        '200':
          description: Field updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldResponse'
  /v0/meta/bases/{baseId}/views:
    get:
      operationId: listViews
      tags: [Metadata]
      summary: List views
      description: Lists the views of a base.
      x-required-scopes: [workspacesAndBases:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - name: include
          in: query
          required: false
          description: Only visibleFieldIds is accepted; adds visibleFieldIds to grid views.
          schema:
            type: array
            items:
              type: string
              enum: [visibleFieldIds]
      responses:
        '200':
          description: Views returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListViewsResponse'
  /v0/meta/bases/{baseId}/views/{viewId}:
    get:
      operationId: getViewMetadata
      tags: [Metadata]
      summary: Get view metadata
      description: Returns metadata for one view.
      x-required-scopes: [workspacesAndBases:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/ViewId'
        - name: include
          in: query
          required: false
          description: Only visibleFieldIds is accepted, and only for grid views.
          schema:
            type: array
            items:
              type: string
              enum: [visibleFieldIds]
      responses:
        '200':
          description: View returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
  /v0/meta/workspaces:
    post:
      operationId: createWorkspace
      tags: [Metadata]
      summary: Create workspace
      description: Enterprise admins only. The requester becomes the workspace owner.
      x-required-scopes: [workspacesAndBases:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '200':
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
  /v0/meta/workspaces/{workspaceId}:
    delete:
      operationId: deleteWorkspace
      tags: [Metadata]
      summary: Delete workspace
      description: Enterprise admins only. Bases in the workspace become inaccessible after deletion.
      x-required-scopes: [workspacesAndBases:manage]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
  /v0/meta/whoami:
    get:
      operationId: getUserIdScopes
      tags: [User]
      summary: Get user info
      description: Returns the token owner's user ID and, when applicable, email and OAuth scopes. No scopes required.
      responses:
        '200':
          description: User info returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'
  /v0/bases/{baseId}/webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhooks
      description: Lists webhooks registered for a base, with their statuses.
      x-required-scopes: [webhook:manage]
      parameters:
        - $ref: '#/components/parameters/BaseId'
      responses:
        '200':
          description: Webhooks returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhooksResponse'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create webhook
      description: Creates a webhook. The MAC secret is returned only at creation. Limits - 10 webhooks per base; an OAuth integration can create 2 per base. Webhooks created with OAuth or personal access tokens expire after 7 days unless refreshed.
      x-required-scopes: [depends on subscribed dataTypes]
      parameters:
        - $ref: '#/components/parameters/BaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '200':
          description: Webhook created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookResponse'
  /v0/bases/{baseId}/webhooks/{webhookId}:
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete webhook
      description: Base creator role required. Response fields not described on the docs page.
      x-required-scopes: [webhook:manage]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Webhook deleted. Response body not described on the docs page.
  /v0/bases/{baseId}/webhooks/{webhookId}/enableNotifications:
    post:
      operationId: enableWebhookNotifications
      tags: [Webhooks]
      summary: Enable or disable webhook notifications
      description: Base creator role required. Response body not described on the docs page.
      x-required-scopes: [webhook:manage]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableNotificationsRequest'
      responses:
        '200':
          description: Notification setting updated. Response body not described on the docs page.
  /v0/bases/{baseId}/webhooks/{webhookId}/refresh:
    post:
      operationId: refreshWebhook
      tags: [Webhooks]
      summary: Refresh webhook
      description: Extends the expiration of an active webhook with an expiration time to 7 days from the refresh. Base creator role required.
      x-required-scopes: [webhook:manage]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Webhook refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshWebhookResponse'
  /v0/bases/{baseId}/webhooks/{webhookId}/payloads:
    get:
      operationId: listWebhookPayloads
      tags: [Webhooks]
      summary: List webhook payloads
      description: Call after receiving a webhook ping. Extends the webhook expiration to 7 days from the call. Payloads are deleted after 1 week.
      x-required-scopes: [depends on subscribed dataTypes]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/WebhookId'
        - name: cursor
          in: query
          required: false
          description: Transaction number to start from. Defaults to 1. Reuse the last returned cursor.
          schema:
            type: number
        - name: limit
          in: query
          required: false
          description: Maximum payloads to return. Hard maximum of 50.
          schema:
            type: number
      responses:
        '200':
          description: Payloads returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhookPayloadsResponse'
