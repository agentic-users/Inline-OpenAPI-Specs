            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
      responses:
        '200':
          description: SCIM user patched.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
  /v0/{baseId}/{tableIdOrName}/listRecords:
    post:
      operationId: listRecordsPost
      tags: [Records]
      summary: List records (POST)
      description: Same as listRecords, with parameters in the JSON body. Used when the GET URL would exceed 16,000 characters.
      x-required-scopes: [data.records:read]
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/TableIdOrName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListRecordsRequest'
      responses:
        '200':
          description: Records returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecordsResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token or OAuth integration token.
  parameters:
    BaseId:
      name: baseId
      in: path
      required: true
      description: Base ID.
      schema:
        type: string
    TableIdOrName:
      name: tableIdOrName
      in: path
      required: true
      description: Table ID (recommended) or name.
      schema:
        type: string
    TableId:
      name: tableId
      in: path
      required: true
      description: Table ID.
      schema:
        type: string
    RecordId:
      name: recordId
      in: path
      required: true
      description: Record ID.
      schema:
        type: string
    RowCommentId:
      name: rowCommentId
      in: path
      required: true
      description: Comment ID.
      schema:
        type: string
    ColumnId:
      name: columnId
      in: path
      required: true
      description: Field ID.
      schema:
        type: string
    ViewId:
      name: viewId
      in: path
      required: true
      description: View ID.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace ID.
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook ID.
      schema:
        type: string
    AttachmentFieldIdOrName:
      name: attachmentFieldIdOrName
      in: path
      required: true
      description: Attachment field ID or name.
      schema:
        type: string
    EnterpriseAccountId:
      name: enterpriseAccountId
      in: path
      required: true
      description: Enterprise account ID.
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      description: User ID.
      schema:
        type: string
    PackageId:
      name: packageId
      in: path
      required: true
      description: Package ID.
      schema:
        type: string
  schemas:
    SortSpec:
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: Field name to sort on.
        direction:
          type: string
          enum: [asc, desc]
          description: Defaults to asc.
    ListRecordsRequest:
      type: object
      description: Same parameters as the listRecords query string, sent as JSON.
      properties:
        timeZone:
          type: string
        userLocale:
          type: string
        pageSize:
          type: number
        maxRecords:
          type: number
        offset:
          type: string
        view:
          type: string
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortSpec'
        filterByFormula:
          type: string
        cellFormat:
          type: string
          enum: [json, string]
        fields:
          type: array
          items:
            type: string
        returnFieldsByFieldId:
          type: boolean
        includeDateDependencyMetadata:
          type: boolean
        recordMetadata:
          type: array
          items:
            type: string
            enum: [commentCount]
    ListRecordsResponse:
      type: object
      required: [records]
      properties:
        offset:
          type: string
          description: Present when more records exist.
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordObject'
    RecordFields:
      type: object
      description: Cell values keyed by field name or ID (depending on returnFieldsByFieldId). Empty values are omitted.
      additionalProperties:
        description: type not stated on docs page
    RecordObject:
      type: object
      required: [id, createdTime, fields]
      properties:
        id:
          type: string
        createdTime:
          type: string
          format: date-time
        fields:
          $ref: '#/components/schemas/RecordFields'
        commentCount:
          type: number
          description: Present when recordMetadata includes commentCount.
    Details:
      type: object
      required: [message, reasons]
      properties:
        message:
          type: string
          enum: [partialSuccess, cellsRedactedDueToLimitedPermissions]
        reasons:
          type: array
          items:
            type: string
            enum: [attachmentsFailedUploading, attachmentUploadRateIsTooHigh, restrictedPermissions]
    CreateRecordsRequest:
      type: object
      description: Provide fields to create one record, or records (each with fields) to create several.
      properties:
        fields:
          $ref: '#/components/schemas/RecordFields'
        records:
          type: array
          items:
            type: object
            required: [fields]
            properties:
              fields:
                $ref: '#/components/schemas/RecordFields'
        returnFieldsByFieldId:
          type: boolean
          default: false
        typecast:
          type: boolean
          default: false
          description: Best-effort conversion of string values to cell types.
    CreateRecordsResponse:
      oneOf:
        - type: object
          required: [records]
          properties:
            records:
              type: array
              items:
                $ref: '#/components/schemas/RecordObject'
            details:
              $ref: '#/components/schemas/Details'
        - $ref: '#/components/schemas/RecordObject'
    UpdateMultipleRecordsRequest:
      type: object
      required: [records]
      properties:
        performUpsert:
          type: object
          required: [fieldsToMergeOn]
          properties:
            fieldsToMergeOn:
              type: array
              minItems: 1
              maxItems: 3
              items:
                type: string
              description: 1 to 3 field names or IDs that uniquely identify a record. Computed fields are not allowed. Allowed types - number, text, long text, single select, multiple select, date.
        returnFieldsByFieldId:
          type: boolean
          default: false
        typecast:
          type: boolean
          default: false
        records:
          type: array
          items:
            type: object
            required: [fields]
            properties:
              id:
                type: string
                description: Required when performUpsert is not set. Ignored for matching when performUpsert is set and the ID is given.
              fields:
                $ref: '#/components/schemas/RecordFields'
    UpdateMultipleRecordsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordObject'
        details:
          $ref: '#/components/schemas/Details'
        createdRecords:
          type: array
          items:
            type: string
          description: IDs of newly created records (upsert only).
        updatedRecords:
          type: array
          items:
            type: string
          description: IDs of updated existing records (upsert only).
    DeleteMultipleRecordsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            type: object
            required: [id, deleted]
            properties:
              id:
                type: string
              deleted:
                type: boolean
                const: true
    UpdateRecordRequest:
      type: object
      required: [fields]
      properties:
        fields:
          $ref: '#/components/schemas/RecordFields'
        returnFieldsByFieldId:
          type: boolean
          default: false
        typecast:
          type: boolean
          default: false
    UploadAttachmentRequest:
      type: object
      required: [contentType, file, filename]
      properties:
        contentType:
          type: string
          maxLength: 255
          description: MIME type, e.g. image/jpeg.
        file:
          type: string
          description: Base64-encoded file contents. 5 MB limit.
        filename:
          type: string
          description: e.g. foo.jpg
    Comment:
      type: object
      required: [id, createdTime, lastUpdatedTime, text, author]
      properties:
        id:
          type: string
        createdTime:
          type: string
          format: date-time
        lastUpdatedTime:
          type: [string, 'null']
          format: date-time
          description: Null if never edited.
        text:
          type: string
        parentCommentId:
          type: string
          description: Set for threaded replies.
        mentioned:
          type: object
          description: Map of user ID to mentioned-user object.
          additionalProperties:
            type: object
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/CommentAttachment'
        reactions:
          type: array
          items:
            type: object
            required: [emoji, reactingUser]
            properties:
              emoji:
                type: object
                required: [unicodeCharacter]
                properties:
                  unicodeCharacter:
                    type: string
              reactingUser:
                type: object
                required: [userId, email]
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
        author:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
    CommentAttachment:
      type: object
      required: [id, filename, url]
      properties:
        id:
          type: string
        type:
          type: string
        filename:
          type: string
        url:
          type: string
          description: Expires 2 hours after being returned.
        width:
          type: number
        height:
          type: number
        size:
          type: number
        thumbnails:
          type: object
          properties:
            small:
              $ref: '#/components/schemas/Thumbnail'
            large:
              $ref: '#/components/schemas/Thumbnail'
            full:
              $ref: '#/components/schemas/Thumbnail'
    Thumbnail:
      type: object
      required: [url]
      properties:
        url:
          type: string
        width:
          type: number
        height:
          type: number
    ListCommentsResponse:
      type: object
      required: [offset, comments]
      properties:
        offset:
          type: [string, 'null']
        comments:
          type: array
          description: Sorted newest to oldest.
          items:
            $ref: '#/components/schemas/Comment'
    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Use @[userId] for mentions.
        parentCommentId:
          type: string
    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
    DeletedResponse:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean
    IdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
    ErrorsResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            description: Error entry; the docs show id, email, type and message in various examples.
            properties:
              id:
                type: string
              email:
                type: string
              type:
                type: string
              message:
                type: string
    WorkspaceErrorsResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [type, message, workspaceId]
            properties:
              type:
                type: string
              message:
                type: string
              workspaceId:
                type: string
    ListBasesResponse:
      type: object
      required: [bases]
      properties:
        bases:
          type: array
          items:
            type: object
            required: [id, name, permissionLevel]
            properties:
              id:
                type: string
              name:
                type: string
